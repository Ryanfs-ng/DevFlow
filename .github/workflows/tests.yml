name: DevFlow CI

on:
  push:
    branches:
      - main
      - master
      - Backend

  pull_request:
    branches:
      - main
      - master
      - Backend

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DevFlow-BackEnd

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run tests
        run: mvn clean test
