<aside class="sidebar" [class.collapsed]="collapsed()">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">
        <svg width="20" height="20" viewBox="0 0 28 28" fill="none">
          <rect width="12" height="12" rx="3" fill="currentColor" />
          <rect x="16" width="12" height="12" rx="3" fill="currentColor" opacity="0.7" />
          <rect y="16" width="12" height="12" rx="3" fill="currentColor" opacity="0.5" />
          <rect x="16" y="16" width="12" height="12" rx="3" fill="currentColor" opacity="0.3" />
        </svg>
      </div>
      @if (!collapsed()) {
      <span class="sidebar-logo-text">DevFlow</span>
      }
    </div>
    <button class="collapse-btn" (click)="toggle()" [title]="collapsed() ? 'Expandir' : 'Recolher'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        @if (collapsed()) {
        <polyline points="9 18 15 12 9 6" />
        } @else {
        <polyline points="15 18 9 12 15 6" />
        }
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    @if (!collapsed()) {
    <span class="nav-section-label">PRINCIPAL</span>
    }

    @for (item of navItems; track item.path) {
    <a class="nav-item" [routerLink]="item.path" routerLinkActive="active" [title]="collapsed() ? item.label : ''">
      <span class="nav-icon" [innerHTML]="item.icon"></span>
      @if (!collapsed()) {
      <span class="nav-label">{{ item.label }}</span>
      @if (item.badge) {
      <span class="nav-badge">{{ item.badge }}</span>
      }
      }
    </a>
    }
  </nav>

  <div class="sidebar-spacer"></div>

  <div class="sidebar-bottom">
    <div class="divider"></div>

    <button class="nav-item settings" title="Configurações">
      <span class="nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14" />
        </svg>
      </span>
      @if (!collapsed()) { <span class="nav-label">Configurações</span> }
    </button>

    @if (auth.currentUser(); as user) {
    <div class="sidebar-user" [class.collapsed]="collapsed()">
      <div class="user-avatar" [style.background]="user.color">{{ user.initials }}</div>
      @if (!collapsed()) {
      <div class="user-info">
        <span class="user-name">{{ user.name }}</span>
        <span class="user-role">{{ user.role }}</span>
      </div>
      <button class="logout-btn" (click)="logout()" title="Sair">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
      }
    </div>
    }
  </div>
</aside>
