<header class="topbar">
  <div class="topbar-left">
    <h2 class="page-title">{{ pageTitle }}</h2>
  </div>

  <div class="topbar-center">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" placeholder="Buscar tarefas, boards, membros..." />
      <span class="search-shortcut">⌘K</span>
    </div>
  </div>

  <div class="topbar-right">
    <button class="icon-btn notification-btn" title="Notificações">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
      <span class="notif-dot"></span>
    </button>

    @if (auth.currentUser(); as user) {
    <div class="topbar-user">
      <div class="topbar-avatar" [style.background]="user.color">{{ user.initials }}</div>
      <div class="topbar-user-info">
        <span class="topbar-user-name">{{ user.name }}</span>
        <span class="topbar-user-role">{{ user.role }}</span>
      </div>
    </div>
    }
  </div>
</header>
