<section class="login-page">

  <div class="login-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="login-container animate-fade-in">

    <div class="login-logo">
      <div class="logo-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="12" height="12" rx="3" fill="currentColor" opacity="1" />
          <rect x="16" width="12" height="12" rx="3" fill="currentColor" opacity="0.7" />
          <rect y="16" width="12" height="12" rx="3" fill="currentColor" opacity="0.5" />
          <rect x="16" y="16" width="12" height="12" rx="3" fill="currentColor" opacity="0.3" />
        </svg>
      </div>
      <span class="logo-text">DevFlow</span>
    </div>

    <div class="login-header">
      <h1>Bem-vindo de volta</h1>
      <p>Faça login para acessar seu workspace</p>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">

      <div class="form-group">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
            <polyline points="22,6 12,13 2,6" />
          </svg>
          <input id="email" class="form-control" type="email" placeholder="seu@email.com" [ngModel]="email()"
            (ngModelChange)="email.set($event)" name="email" required autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Senha</label>
          <a href="#" class="forgot-link">Esqueceu a senha?</a>
        </div>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input id="password" class="form-control" [type]="showPass() ? 'text' : 'password'" placeholder="••••••••"
            [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" required
            autocomplete="current-password" />
          <button type="button" class="toggle-pass" (click)="togglePass()">
            @if (showPass()) {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
            } @else {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            }
          </button>
        </div>
      </div>

      @if (error()) {
      <div class="error-msg">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        {{ error() }}
      </div>
      }

      <button type="submit" class="btn btn-primary btn-lg submit-btn" [class.loading]="loading()"
        [disabled]="loading()">
        @if (loading()) {
        <span class="spinner"></span>
        Entrando...
        } @else {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
          <polyline points="10 17 15 12 10 7" />
          <line x1="15" y1="12" x2="3" y2="12" />
        </svg>
        Entrar no DevFlow
        }
      </button>
    </form>

    <div class="login-footer">
      <span>Novo por aqui?</span>
      <a href="#">Solicitar acesso</a>
    </div>
  </div>
</section>
