<div class="modal-overlay" (click)="onOverlayClick($event)">
  <div class="modal-panel animate-fade-in">
    <div class="modal-header">
      <h2>{{ isEditing ? 'Editar Tarefa' : 'Nova Tarefa' }}</h2>
      <div class="modal-header-actions">
        @if (isEditing) {
        <button class="btn btn-danger btn-sm" (click)="onDelete()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
          </svg>
          Excluir
        </button>
        }
        <button class="btn-icon" (click)="close.emit()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label for="task-title">Título *</label>
        <input id="task-title" class="form-control" type="text" placeholder="Nome da tarefa..." [(ngModel)]="title" />
      </div>

      <div class="form-group">
        <label for="task-desc">Descrição</label>
        <textarea id="task-desc" class="form-control form-control-textarea"
          placeholder="Descreva os detalhes da tarefa..." [(ngModel)]="description" rows="3"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="task-status">Status</label>
          <select id="task-status" class="form-control" [(ngModel)]="status">
            @for (opt of statusOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="task-priority">Prioridade</label>
          <select id="task-priority" class="form-control" [(ngModel)]="priority">
            @for (opt of priorityOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
            }
          </select>
        </div>
      </div>

      <div class="priority-indicator">
        @for (opt of priorityOptions; track opt.value) {
        <button class="priority-chip" [class.active]="priority === opt.value" [style.--chip-color]="opt.color"
          (click)="priority = opt.value" type="button">
          <span class="chip-dot" [style.background]="opt.color"></span>
          {{ opt.label }}
        </button>
        }
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="task-start">Data de Início</label>
          <input id="task-start" class="form-control" type="date" [(ngModel)]="startDate" />
        </div>
        <div class="form-group">
          <label for="task-due">Data de Término</label>
          <input id="task-due" class="form-control" type="date" [(ngModel)]="dueDate" />
        </div>
      </div>

      <div class="form-group">
        <label>Atribuir a</label>
        <div class="assignees-grid">
          @for (m of members; track m.id) {
          <button class="assignee-chip" [class.selected]="isAssigned(m.id)" (click)="toggleAssignee(m.id)"
            type="button">
            <div class="avatar avatar-sm" [style.background]="m.color">{{ m.initials }}</div>
            <div class="assignee-chip-info">
              <span class="assignee-name">{{ m.name.split(' ')[0] }}</span>
              <span class="assignee-role">{{ m.role }}</span>
            </div>
            @if (isAssigned(m.id)) {
            <svg class="assignee-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5">
              <polyline points="20 6 9 17 4 12" />
            </svg>
            }
          </button>
          }
        </div>
      </div>

      <div class="form-group">
        <label for="task-tags">Tags</label>
        <div class="tags-input-wrapper">
          @for (tag of tags; track tag) {
          <span class="tag-chip">
            {{ tag }}
            <button (click)="removeTag(tag)" type="button">×</button>
          </span>
          }
          <input id="task-tags" type="text" placeholder="Digite e pressione Enter..." [(ngModel)]="tagInput"
            (keydown)="addTag($event)" />
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" (click)="close.emit()">Cancelar</button>
      <button class="btn btn-primary" (click)="save()" [disabled]="!title.trim() || saving()"
        [class.loading]="saving()">
        @if (saving()) {
        <span class="spinner"></span>
        Salvando...
        } @else {
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12" />
        </svg>
        {{ isEditing ? 'Salvar Alterações' : 'Criar Tarefa' }}
        }
      </button>
    </div>
  </div>
</div>
